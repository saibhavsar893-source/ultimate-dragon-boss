name: Build Ultimate Dragon Boss

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif command -v gradle >/dev/null 2>&1; then
            gradle build
          else
            echo "Gradle wrapper ya Gradle install nahi hai."
            exit 1
          fi

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-dragon-boss-build
          path: build/libs/*.jar
          if-no-files-found: error
